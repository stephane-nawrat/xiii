# === Service Base de Données ===
  xiii-db:
    image: mysql:8.4
    container_name: xiii-db
    restart: unless-stopped
    
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    
    ports:
      - "3307:3306"
    
    volumes:
      - xiii_db_data:/var/lib/mysql
    
    networks:
      - xiii-network
    
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === Service API Node.js ===
  xiii-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    
    container_name: xiii-api
    restart: unless-stopped
    
    ports:
      - "3001:3001"
    
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${API_PORT}
      DB_HOST: xiii-db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    
    volumes:
      - ./backend:/app
      - /app/node_modules
    
    depends_on:
      xiii-db:
        condition: service_healthy
    
    networks:
      - xiii-network
    
    command: npm run dev